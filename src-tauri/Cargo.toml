[workspace]
resolver = "2"

[package]
name = "phlox"
version = "2.5.1"
description = "Open-source AI scribe with patient management"
authors = ["bloodworks-io"]
license = "MIT"
repository = "https://github.com/bloodworks-io/phlox"
edition = "2021"

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = ["macos-private-api"] }
tauri-plugin-http = "=2.8.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
dirs = "=7.0.0"
sysinfo = "=0.39.6"

log = "=0.4.34"
tauri-plugin-log = { version = "=2.10.0", features = [
    "colored",
    "tracing",
] }

# Encryption dependencies (minimal - just hex encoding)
hex = "=0.4.3"
thiserror = "=2.0.21"


[target."cfg(target_os = \"macos\")".dependencies]
objc2 = "=0.6.4"
block2 = "=0.6.2"
objc2-app-kit = { version = "=0.3.2", features = [
    "NSWindow",
    "NSView",
    "NSResponder",
    "NSColor",
    "NSButton",
    "NSControl",
    "objc2-core-foundation",
] }
objc2-foundation = { version = "=0.3.2", features = [
    "NSGeometry",
    "NSNotification",
    "NSOperation",
    "NSString",
    "block2",
    "objc2-core-foundation",
] }

[target."cfg(unix)".dependencies]
libc = "=0.2.190"


[target."cfg(target_os = \"linux\")".dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_40"] }

[target."cfg(windows)".dependencies]
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Console"] }

[[bin]]
name = "phlox"
path = "src/main.rs"
