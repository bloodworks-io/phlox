# Deploys the browser-only demo to GitHub Pages from the demo branch.
# NOTE: repo convention pins actions to commit SHAs (pinact); pin these tags
# to SHAs before merging this workflow into a long-lived branch.
name: Deploy demo to GitHub Pages

on:
  push:
    branches: [demo/browser-only]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build (repo subpath)
        run: npm run build
        env:
          GITHUB_PAGES_BASE: /${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
