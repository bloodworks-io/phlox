name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag whose draft release gets the artifacts (e.g. v2.5.0); leave empty for a gates-only dry run"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
    outputs:
      macos_gate: ${{ steps.macgate.outputs.status }}
    strategy:
      matrix:
        include:
          - platform: "macos-latest"
            arch: "aarch64"
            os: "darwin"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false

      # parakeet.cpp (patched for the Omi Med STT adapter) - pinned commit e8acc617
      - name: Checkout parakeet.cpp and apply Omi adapter patch
        run: |
          git clone https://github.com/mudler/parakeet.cpp.git src-tauri/parakeet.cpp
          cd src-tauri/parakeet.cpp && git checkout e8acc6172a94e20a952cf1843decace5d771a94b
          EXPECTED="e8acc6172a94e20a952cf1843decace5d771a94b"
          ACTUAL=$(git rev-parse HEAD)
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "❌ SHA mismatch: expected $EXPECTED, got $ACTUAL"
            exit 1
          fi
          git submodule update --init --recursive
          git apply --recount ../parakeet-cpp-omi-adapter.patch
          rm -rf src-tauri/parakeet.cpp/.git

      # llama.cpp b9437
      - name: Checkout llama.cpp
        run: |
          git clone https://github.com/ggml-org/llama.cpp.git src-tauri/llama.cpp
          cd src-tauri/llama.cpp && git checkout aa46bda89b9a8378ae76bb15fc2ce2f571f0983c
          EXPECTED="aa46bda89b9a8378ae76bb15fc2ce2f571f0983c"
          ACTUAL=$(git rev-parse HEAD)
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "❌ SHA mismatch: expected $EXPECTED, got $ACTUAL"
            exit 1
          fi
          rm -rf src-tauri/llama.cpp/.git

      - name: Import signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "❌ APPLE_CERTIFICATE secret is not set"
            exit 1
          fi
          if [ -z "$APPLE_CERTIFICATE_PASSWORD" ]; then
            echo "❌ APPLE_CERTIFICATE_PASSWORD secret is not set"
            exit 1
          fi
          if [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            echo "❌ APPLE_SIGNING_IDENTITY secret is not set"
            exit 1
          fi

          # Generate and mask keychain password
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          echo "::add-mask::$KEYCHAIN_PASSWORD"

          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 3600 build.keychain

          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12

          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f certificate.p12

          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain

          # Verify the identity is actually present before we waste time compiling
          if ! security find-identity -v -p codesigning build.keychain | grep -q "$APPLE_SIGNING_IDENTITY"; then
            echo "❌ Signing identity '$APPLE_SIGNING_IDENTITY' not found in keychain after import"
            security find-identity -v -p codesigning build.keychain
            exit 1
          fi

          echo "✅ Certificate imported and signing identity verified"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7
        with:
          targets: aarch64-apple-darwin

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          cache: "npm"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version-file: "server/pyproject.toml"

      - name: Install ccache and Homebrew Python
        run: brew install ccache python@3.12

      - name: Cache Nuitka and ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/Nuitka
            ~/.cache/ccache
          key: nuitka-ccache-${{ runner.os }}-${{ hashFiles('server/**/*.py', 'server/uv.lock') }}
          restore-keys: |
            nuitka-ccache-${{ runner.os }}-

      - name: Set up Python venv with uv
        run: |
          cd server
          uv sync --locked --extra rag --python /opt/homebrew/bin/python3.12

      - name: Install dependencies
        run: npm ci

      - name: Build all components
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: ./build-all.sh

      - name: Build and notarize Tauri app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          npm run tauri -- build --target aarch64-apple-darwin -- --locked

      - name: Verify codesign, Gatekeeper, and notarization ticket
        id: macgate
        run: |
          set -euo pipefail
          DMG=$(ls src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg)
          echo "Verifying ${DMG}"

          PLIST=$(hdiutil attach "$DMG" -nobrowse -readonly -plist)
          DEVICE=$(/usr/libexec/PlistBuddy -c 'Print :system-entities:0:dev-entry' /dev/stdin <<< "$PLIST")
          MOUNT_POINT=$(/usr/libexec/PlistBuddy -c 'Print :system-entities:0:mount-point' /dev/stdin <<< "$PLIST")
          # Detach even when a check below fails
          trap 'hdiutil detach "$DEVICE" -force >/dev/null 2>&1 || true' EXIT

          APP=$(ls -d "$MOUNT_POINT"/*.app)
          echo "App bundle: ${APP}"

          SUMMARY="$GITHUB_STEP_SUMMARY"
          echo "## macOS release verification (fail-hard)" >> "$SUMMARY"
          echo "- DMG: ${DMG}" >> "$SUMMARY"

          codesign --verify --deep --strict --verbose=2 "$APP"
          echo "- ✅ codesign: signature valid (deep + strict)" >> "$SUMMARY"

          spctl --assess --type execute --verbose "$APP"
          echo "- ✅ Gatekeeper: assessment passed" >> "$SUMMARY"

          xcrun stapler validate "$APP"
          echo "- ✅ notarization: ticket stapled" >> "$SUMMARY"

          echo "status=verified (codesign+gatekeeper+stapler)" >> "$GITHUB_OUTPUT"

      - name: Upload DMG
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Phlox-${{ matrix.os }}-${{ matrix.arch }}
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg

  build-windows:
    permissions:
      contents: read
    outputs:
      windows_signature: ${{ steps.winsig.outputs.status }}
      windows_signer: ${{ steps.winsig.outputs.signer }}
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false

      - name: Enable long paths
        run: git config --system core.longpaths true

      # parakeet.cpp (patched for the Omi Med STT adapter) - pinned commit e8acc617
      - name: Checkout parakeet.cpp and apply Omi adapter patch
        run: |
          git clone https://github.com/mudler/parakeet.cpp.git src-tauri/parakeet.cpp
          cd src-tauri/parakeet.cpp && git checkout e8acc6172a94e20a952cf1843decace5d771a94b
          EXPECTED="e8acc6172a94e20a952cf1843decace5d771a94b"
          ACTUAL=$(git rev-parse HEAD)
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "❌ SHA mismatch: expected $EXPECTED, got $ACTUAL"
            exit 1
          fi
          git submodule update --init --recursive
          git apply --recount ../parakeet-cpp-omi-adapter.patch
          rm -rf src-tauri/parakeet.cpp/.git

      # llama.cpp pinned aa46bda
      - name: Checkout llama.cpp
        run: |
          git clone https://github.com/ggml-org/llama.cpp.git src-tauri/llama.cpp
          cd src-tauri/llama.cpp && git checkout aa46bda89b9a8378ae76bb15fc2ce2f571f0983c
          EXPECTED="aa46bda89b9a8378ae76bb15fc2ce2f571f0983c"
          ACTUAL=$(git rev-parse HEAD)
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "❌ SHA mismatch: expected $EXPECTED, got $ACTUAL"
            exit 1
          fi
          rm -rf src-tauri/llama.cpp/.git

      # Vulkan SDK: shader compiler (glslc) at build time; build-llama.sh also
      # bundles the redistributable loader (vulkan-1.dll) for CPU-only fallback.
      - name: Install Vulkan SDK
        env:
          VULKAN_VERSION: 1.4.357.0
        run: |
          curl -L --retry 3 -o "$RUNNER_TEMP/vulkansdk.exe" \
            "https://sdk.lunarg.com/sdk/download/${VULKAN_VERSION}/windows/vulkansdk-windows-X64-${VULKAN_VERSION}.exe"
          "$RUNNER_TEMP/vulkansdk.exe" --accept-licenses --default-answer --confirm-command install
          SDK_DIR=$(ls -d /c/VulkanSDK/*/ | sort -V | tail -1)
          echo "VULKAN_SDK=$(cygpath -w "$SDK_DIR")" >> "$GITHUB_ENV"
          echo "$(cygpath -u "$SDK_DIR")/Bin" >> "$GITHUB_PATH"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          cache: "npm"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version-file: "server/pyproject.toml"

      - name: Cache Nuitka and ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            C:\Users\runneradmin\AppData\Local\Nuitka
          key: nuitka-ccache-${{ runner.os }}-${{ hashFiles('server/**/*.py', 'server/uv.lock') }}
          restore-keys: |
            nuitka-ccache-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Build all components
        run: bash build-all.sh

      - name: Build Tauri app (NSIS)
        run: npx tauri build -- --locked

      # Warn-only: the installer is not Authenticode-signed yet.
      - name: Check Authenticode signature (warn-only)
        id: winsig
        shell: pwsh
        run: |
          $exe = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $exe) { throw "No *-setup.exe found in NSIS bundle directory" }
          $sig = Get-AuthenticodeSignature $exe.FullName
          "status=$($sig.Status)" >> $env:GITHUB_OUTPUT
          "signer=$($sig.SignerCertificate.Subject)" >> $env:GITHUB_OUTPUT
          "- Installer: $($exe.Name)" >> $env:GITHUB_STEP_SUMMARY
          "- Authenticode status: $($sig.Status)" >> $env:GITHUB_STEP_SUMMARY
          if ($sig.Status -eq 'Valid') {
            "- Signer: $($sig.SignerCertificate.Subject)" >> $env:GITHUB_STEP_SUMMARY
          } else {
            Write-Warning "Installer is not Authenticode-signed (status: $($sig.Status)). Recorded in manifest; not failing the release."
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Phlox-windows-x86_64
          path: src-tauri/target/release/bundle/nsis/*-setup.exe

  build-flatpak:
    permissions:
      contents: read
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48@sha256:50fea670968fd3ec4aeeb3a91d9d807d0af6eab3c3b44c33d4c40c311832c8fa
      options: --privileged

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          bundle: Phlox-linux-x86_64.flatpak
          manifest-path: packaging/com.phlox.app.yaml
          arch: x86_64
          verbose: true
          upload-artifact: false

      - name: Upload Flatpak bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Phlox-linux-x86_64.flatpak
          path: Phlox-linux-x86_64.flatpak


  release-evidence:
    if: inputs.tag != '' || startsWith(github.ref, 'refs/tags/')
    needs: [build, build-windows, build-flatpak]
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: release
          merge-multiple: true

      - name: Generate SHASUMS256.txt and manifest.json
        env:
          TAG_NAME: ${{ inputs.tag || github.ref_name }}
          MACOS_GATE: ${{ needs.build.outputs.macos_gate }}
          WINDOWS_SIGNATURE: ${{ needs.build-windows.outputs.windows_signature }}
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import hashlib
          import json
          import os

          artifacts = {}
          for name in sorted(os.listdir("release")):
              if not name.endswith((".dmg", "-setup.exe", ".flatpak")):
                  continue
              digest = hashlib.sha256()
              with open(os.path.join("release", name), "rb") as fh:
                  for chunk in iter(lambda: fh.read(1 << 20), b""):
                      digest.update(chunk)
              artifacts[name] = digest.hexdigest()

          if not any(n.endswith(".dmg") for n in artifacts):
              raise SystemExit("missing macOS DMG artifact")
          if not any(n.endswith("-setup.exe") for n in artifacts):
              raise SystemExit("missing Windows installer artifact")
          if not any(n.endswith(".flatpak") for n in artifacts):
              raise SystemExit("missing Linux flatpak artifact")

          manifest = {
              "tag": os.environ.get("TAG_NAME") or os.environ["GITHUB_REF_NAME"],
              "commit": os.environ["GITHUB_SHA"],
              "run_url": "{}/{}/actions/runs/{}".format(
                  os.environ["GITHUB_SERVER_URL"],
                  os.environ["GITHUB_REPOSITORY"],
                  os.environ["GITHUB_RUN_ID"],
              ),
              "verification": {
                  "macos_signing_notarization": os.environ.get("MACOS_GATE", "unknown"),
                  "windows_authenticode": os.environ.get("WINDOWS_SIGNATURE", "unknown"),
                  "flatpak": "digest-only (no signature gate)",
              },
              "artifacts": artifacts,
          }
          with open("release/manifest.json", "w") as fh:
              json.dump(manifest, fh, indent=2, sort_keys=True)
              fh.write("\n")
          with open("release/SHASUMS256.txt", "w") as fh:
              fh.write("".join(f"{d}  {n}\n" for n, d in sorted(artifacts.items())))
          print("Artifacts:")
          for name, digest in sorted(artifacts.items()):
              print(f"  {digest}  {name}")
          EOF

      - name: Self-check checksums file
        run: |
          cd release
          shasum -a 256 -c SHASUMS256.txt
          python3 -m json.tool manifest.json >/dev/null

      - name: Attach artifacts and evidence to draft release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            release/*.dmg
            release/*-setup.exe
            release/*.flatpak
            release/SHASUMS256.txt
            release/manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summarize for reviewer
        run: |
          echo "## Release evidence ready" >> "$GITHUB_STEP_SUMMARY"
          echo "All artifacts, \`SHASUMS256.txt\`, and \`manifest.json\` are attached to the **draft** release." >> "$GITHUB_STEP_SUMMARY"
          echo "Before publishing, review the checklist in \`.github/RELEASE.md\`." >> "$GITHUB_STEP_SUMMARY"

  docker:
    runs-on: ubuntu-latest
    if: inputs.tag != '' || startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Extract version from tag
        id: meta
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          VERSION=${TAG#v}
          if [[ ! "$VERSION" =~ ^[0-9] ]]; then
            VERSION="2.0.0"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
