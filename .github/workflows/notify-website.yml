name: Notify website

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  notify-website:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger phlox-website rebuild
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/bloodworks-io/phlox-website/dispatches \
            -d '{"event_type":"phlox-released","client_payload":{"version":"'"$VERSION"'"}}'
